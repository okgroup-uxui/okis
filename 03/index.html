<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKIS 기부자 월</title>
<meta name="description" content="기부자님의 소중한 이름을 새겨넣었습니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="OKIS 기부자 월">
<meta property="og:description" content="기부자님의 소중한 이름을 새겨넣었습니다.">
<meta property="og:url" content="https://okgroup-uxui.github.io/okis/03/">
<meta property="og:image" content="https://okgroup-uxui.github.io/okis/03/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e065e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>
  /* Noto Serif KR을 못 불러올 때 쓰는 대체 서체 (DX새신문명조B, 한글 2,350자+영문 서브셋) */
  @font-face {
    font-family: "DX SaeSinmun Myeongjo";
    src: url("fonts/DXNShnmB.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --navy: #0e065e;
    --bronze: #8c6c4f;
    --gray: #6b7280;
    --serif: "Noto Serif KR", "DX SaeSinmun Myeongjo", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { background: var(--navy); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body {
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: var(--navy);
    font-family: var(--serif);
  }
  body.locked { overflow: hidden; }

  /* ===== 메인 (Figma 360×800 기준) ===== */
  .frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 520px;
    min-height: 100%;
    margin: 0 auto;
    padding: 29px 14px 24px;
    border: 16px solid var(--navy);
    background: #fff;
  }
  .emblem { display: block; width: 80px; height: auto; }

  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 40px 0;
  }
  .thanks {
    color: var(--bronze);
    font-size: clamp(14px, 4.2vw, 16px);
    line-height: 1.55;
    text-align: center;
    word-break: keep-all;
    text-wrap: balance;
  }
  .poster {
    position: relative;
    display: block;
    width: 100%;
    margin: 48px 0 0;
    padding: 0;
    border: 0;
    background: none;
    cursor: zoom-in;
    transition: transform .15s ease;
  }
  .poster img { display: block; width: 100%; height: auto; }
  .poster:active { transform: scale(.98); }
  .zoom-badge {
    position: absolute;
    right: 6px;
    bottom: 6px;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(14, 6, 94, .8);
    color: #fff;
    pointer-events: none;
  }
  .zoom-badge svg { width: 16px; height: 16px; }
  .poster:focus-visible { outline: 3px solid var(--bronze); outline-offset: 3px; }
  .guide {
    color: var(--gray);
    font-size: 14px;
    line-height: 1.45;
    text-align: center;
    word-break: keep-all;
  }
  .note {
    align-self: flex-end;
    margin: 8px 0 32px;
    color: #9ca3af;
    font-size: 11px;
    line-height: 1.4;
    letter-spacing: -.01em;
    text-align: right;
    word-break: keep-all;
  }
  .wordmark { display: block; width: min(86%, 300px); height: auto; }

  /* ===== 뷰어 ===== */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    background: #0a0f2a;
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s;
  }
  .viewer.open { opacity: 1; visibility: visible; }
  .viewer-bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px 16px;
    color: #fff;
  }
  .viewer-title { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
  .close-btn {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: #fff;
    cursor: pointer;
  }
  .close-btn svg { width: 22px; height: 22px; }

  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    margin-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
    touch-action: none;        /* 제스처는 직접 처리 */
    cursor: grab;
  }
  .stage.dragging { cursor: grabbing; }
  .stage img {
    position: absolute;
    left: 0; top: 0;
    max-width: none;
    transform-origin: 0 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }
  .loading {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: rgba(255,255,255,.85);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
    pointer-events: none;
  }
  .loading.show { display: flex; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .swipe-hint {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,.6);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 13px;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .4s;
  }
  .swipe-hint.hide { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .viewer, .swipe-hint, .poster { transition: none; }
    .spinner { animation-duration: 2.5s; }
  }
</style>
</head>
<body>
  <main class="frame">
    <img class="emblem" src="img/emblem.jpg" alt="오사카코리안인터내셔널스쿨 엠블럼" width="206" height="276">

    <div class="body">
      <p class="thanks">기부자님의 소중한 이름을 새겨넣었습니다.<br>다시한번 OKIS에 보내주신 따뜻한 마음에 감사 드립니다.</p>

      <button type="button" class="poster" id="openViewer" aria-label="OKIS HONORS CLUB 명판 사진 크게 보기">
        <img src="img/thumb.jpg" alt="OKIS HONORS CLUB 기부자 명판 벽면" width="1575" height="533">
        <span class="zoom-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
        </span>
      </button>
      <p class="note">* 고화질 사진이라 로딩이 다소 느릴 수 있습니다.</p>

      <p class="guide">위 사진을 클릭하시면<br>기부자님의 이름을 찾아보실 수 있습니다.</p>
    </div>

    <img class="wordmark" src="img/title.jpg" alt="OKIS HONORS CLUB" width="1293" height="98">
  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="OKIS HONORS CLUB 전체 사진" aria-hidden="true">
    <div class="viewer-bar">
      <span class="viewer-title">OKIS HONORS CLUB</span>
      <button type="button" class="close-btn" id="closeViewer" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="stage" id="stage">
      <!-- 고해상도 원본 이미지 -->
      <img id="bigImg" src="img/img_02.jpg" alt="OKIS HONORS CLUB 기부자 명판 벽면 전체" draggable="false">
      <div class="loading" id="loading" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>사진을 불러오는 중입니다.<br>용량이 커서 조금 걸릴 수 있어요.</span>
      </div>
      <div class="swipe-hint" id="swipeHint">좌우로 밀어서 보고, 두 손가락으로 벌려 확대하세요</div>
    </div>
  </div>

<script>
(function () {
  const viewer   = document.getElementById('viewer');
  const stage    = document.getElementById('stage');
  const img      = document.getElementById('bigImg');
  const hint     = document.getElementById('swipeHint');
  const openBtn  = document.getElementById('openViewer');
  const closeBtn = document.getElementById('closeViewer');
  const loading  = document.getElementById('loading');

  const MAX_WIDTH = 14000; // 최대 확대 시 이미지 가로 폭(px)

  // baseW/H: 이미지 전체가 화면에 들어가는 크기(scale 1)
  let baseW = 0, baseH = 0, fillScale = 1;
  let s = 1, tx = 0, ty = 0;   // 현재 배율과 위치
  let layoutS = 1;             // img width/height에 반영된 배율 (선명도용)

  const ratio = () => (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 1575 / 533;
  const minScale = () => 1;
  const maxScale = () => Math.max(fillScale * 3, MAX_WIDTH / baseW);

  function computeBase() {
    const W = stage.clientWidth, H = stage.clientHeight, r = ratio();
    baseH = Math.min(H, W / r);
    baseW = baseH * r;
    fillScale = Math.max(1, H / baseH);
  }

  // 화면 밖으로 빠지지 않게 위치 보정 (작으면 가운데 정렬)
  function clamp() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const w = baseW * s, h = baseH * s;
    tx = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, tx));
    ty = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, ty));
  }

  function render() {
    const k = s / layoutS;
    img.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${k})`;
  }

  // 제스처가 끝나면 실제 크기로 다시 그려서 확대 상태에서도 선명하게
  function commit() {
    layoutS = s;
    img.style.width  = (baseW * s) + 'px';
    img.style.height = (baseH * s) + 'px';
    render();
  }

  // 화면 좌표(px, py) 지점을 고정한 채로 배율 변경
  function zoomAt(next, px, py) {
    next = Math.min(maxScale(), Math.max(minScale(), next));
    const ix = (px - tx) / s, iy = (py - ty) / s;
    s = next;
    tx = px - ix * s;
    ty = py - iy * s;
    clamp();
  }

  function resetView() {
    computeBase();
    s = fillScale;               // 화면 높이를 꽉 채운 상태로 시작
    tx = (stage.clientWidth - baseW * s) / 2;   // 가운데(학교 엠블럼)부터
    ty = 0;
    clamp();
    commit();
  }

  function showLoadError() {
    loading.classList.add('show');
    loading.querySelector('.spinner').style.display = 'none';
    loading.lastElementChild.innerHTML = '사진을 불러오지 못했습니다.<br>잠시 후 다시 열어 주세요.';
  }

  // ===== 열기 / 닫기 =====
  function open() {
    viewer.classList.add('open');
    viewer.setAttribute('aria-hidden', 'false');
    document.body.classList.add('locked');
    hint.classList.remove('hide');
    if (img.complete && img.naturalWidth) {
      resetView();
    } else {
      loading.classList.add('show');
      img.style.visibility = 'hidden';
      img.onload = () => {
        loading.classList.remove('show');
        img.style.visibility = '';
        resetView();
      };
      img.onerror = showLoadError;
      if (img.complete) showLoadError();   // 이미 실패한 경우
    }
    history.pushState({ viewer: true }, '');
    closeBtn.focus();
    clearTimeout(open.t);
    open.t = setTimeout(() => hint.classList.add('hide'), 2800);
  }
  function close(fromPop) {
    if (!viewer.classList.contains('open')) return;
    stopInertia();
    viewer.classList.remove('open');
    viewer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('locked');
    openBtn.focus();
    if (!fromPop && history.state && history.state.viewer) history.back();
  }
  openBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', () => close(false));
  window.addEventListener('popstate', () => close(true));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(false); });

  // iOS Safari 페이지 자체 확대 막기 (뷰어 안에서는 이미지만 확대)
  ['gesturestart', 'gesturechange'].forEach(t =>
    viewer.addEventListener(t, e => e.preventDefault()));

  // ===== 관성 스크롤 =====
  let raf = 0, vx = 0, vy = 0, lastT = 0;
  function stopInertia() { cancelAnimationFrame(raf); raf = 0; }
  function inertia() {
    let prev = performance.now();
    const step = now => {
      const dt = Math.min(32, now - prev); prev = now;
      tx += vx * dt; ty += vy * dt;
      const bx = tx, by = ty;
      clamp();
      if (bx !== tx) vx = 0;
      if (by !== ty) vy = 0;
      render();
      const decay = Math.pow(0.95, dt / 16);
      vx *= decay; vy *= decay;
      if (Math.abs(vx) > 0.02 || Math.abs(vy) > 0.02) raf = requestAnimationFrame(step);
      else raf = 0;
    };
    raf = requestAnimationFrame(step);
  }

  // ===== 터치/마우스: 한 손가락 이동, 두 손가락 확대 =====
  const pts = new Map();
  let pan = null, pinch = null;

  function local(e) {
    const r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function startPan() {
    const p = [...pts.values()][0];
    pan = { x: p.x, y: p.y };
    vx = vy = 0; lastT = performance.now();
  }
  function startPinch() {
    const [a, b] = [...pts.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    pinch = {
      d: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      s: s,
      ix: (mx - tx) / s,   // 두 손가락 가운데가 가리키는 이미지 위의 점
      iy: (my - ty) / s
    };
    pan = null;
  }

  stage.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    stopInertia();
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, local(e));
    hint.classList.add('hide');
    if (pts.size === 1) { startPan(); stage.classList.add('dragging'); }
    else if (pts.size === 2) startPinch();
  });

  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, local(e));

    if (pinch && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      s = Math.min(maxScale(), Math.max(minScale(), pinch.s * d / pinch.d));
      // 손가락 사이 지점이 그대로 손가락 아래에 머물도록
      tx = mx - pinch.ix * s;
      ty = my - pinch.iy * s;
      clamp();
      render();
    } else if (pan && pts.size === 1) {
      const p = pts.get(e.pointerId);
      const dx = p.x - pan.x, dy = p.y - pan.y;
      const now = performance.now(), dt = Math.max(1, now - lastT);
      vx = vx * 0.6 + (dx / dt) * 0.4;
      vy = vy * 0.6 + (dy / dt) * 0.4;
      lastT = now;
      pan.x = p.x; pan.y = p.y;
      tx += dx; ty += dy;
      clamp();
      render();
    }
  });

  function endPointer(e) {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pinch && pts.size < 2) {
      pinch = null;
      commit();                       // 확대 끝 → 선명하게 다시 그림
      if (pts.size === 1) startPan(); // 남은 손가락으로 계속 이동
    } else if (pts.size === 0) {
      pan = null;
      stage.classList.remove('dragging');
      if (performance.now() - lastT < 80) inertia();
    }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);

  // ===== PC: 트랙패드 핀치(ctrl+휠) 확대, 휠 스크롤 이동 =====
  let wheelT = 0;
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    stopInertia();
    hint.classList.add('hide');
    if (e.ctrlKey) {
      const p = local(e);
      zoomAt(s * Math.exp(-e.deltaY * 0.01), p.x, p.y);
      render();
      clearTimeout(wheelT);
      wheelT = setTimeout(commit, 150);
    } else {
      const H = stage.clientHeight;
      const vertRoom = baseH * s > H;
      tx -= e.deltaX || (vertRoom ? 0 : e.deltaY);
      ty -= vertRoom ? e.deltaY : 0;
      clamp();
      render();
    }
  }, { passive: false });

  // ===== 화면 회전 대응 =====
  window.addEventListener('resize', () => {
    if (!viewer.classList.contains('open')) return;
    const W0 = baseW * s;
    const cx = (stage.clientWidth / 2 - tx) / W0;   // 화면 중앙이 보던 위치(비율)
    const rel = s / fillScale;
    computeBase();
    s = Math.min(maxScale(), Math.max(1, fillScale * rel));
    tx = stage.clientWidth / 2 - cx * baseW * s;
    clamp();
    commit();
  });
})();
</script>
</body>
</html>
